[workspace]
resolver = "2"
members = ["crates/poximp-engine", "crates/poximp-codecs", "crates/poximp-quality", "crates/poximp-library", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
poximp-engine = { path = "crates/poximp-engine" }
poximp-quality = { path = "crates/poximp-quality" }
poximp-codecs = { path = "crates/poximp-codecs" }
poximp-library = { path = "crates/poximp-library" }
# Default features already bring opt-simd, all-meta, adpcm, flac, mkv, ogg, pcm, vorbis, wav
symphonia = { version = "0.6.1", features = ["mp3", "aac", "alac", "isomp4", "aiff", "caf"] }
cpal = "0.18.2"
rtrb = "0.4.1"
rubato = "5.0.1"
realfft = "3.5.1"
crossbeam-channel = "0.5.17"
lofty = "0.25.5"
# bundled = SQLite compiled in, FTS5 included
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# unwind (not abort): decoders run on untrusted files and panics are caught per file
panic = "unwind"
strip = true
